// Save data. Every read and write is guarded: private windows, blocked storage inside iframes,
// full quotas and corrupted JSON must never break the game. It falls back to memory.
(function (root) {
  const G = root.Grudge;
  const KEY = 'grudge-block-save-v1';
  const MAX_DEATHS_PER_LEVEL = 20;

  function fresh() {
    return { v: 1, level: 0, totalDeaths: 0, deaths: {}, memory: {}, lang: null, muted: false };
  }

  function sanitize(raw) {
    const s = fresh();
    if (!raw || typeof raw !== 'object') return s;
    if (Number.isInteger(raw.level) && raw.level >= 0) s.level = raw.level;
    if (Number.isFinite(raw.totalDeaths) && raw.totalDeaths >= 0) s.totalDeaths = Math.floor(raw.totalDeaths);
    if (raw.deaths && typeof raw.deaths === 'object') {
      for (const id of Object.keys(raw.deaths)) {
        if (!Array.isArray(raw.deaths[id])) continue;
        s.deaths[id] = raw.deaths[id]
          .filter((d) => d && Number.isFinite(d.x) && Number.isFinite(d.y) && typeof d.cause === 'string')
          .slice(-MAX_DEATHS_PER_LEVEL);
      }
    }
    if (typeof raw.lang === 'string') s.lang = raw.lang;
    s.muted = raw.muted === true;
    if (raw.memory && typeof raw.memory === 'object') {
      for (const id of Object.keys(raw.memory)) {
        const m = raw.memory[id];
        if (!m || !Number.isInteger(m.deaths) || m.deaths < 0 || !Array.isArray(m.active)) continue;
        s.memory[id] = { deaths: m.deaths, active: m.active.filter((a) => typeof a === 'string').slice(-2) };
      }
    }
    return s;
  }

  function load() {
    try {
      const text = root.localStorage.getItem(KEY);
      return text ? sanitize(JSON.parse(text)) : fresh();
    } catch (e) {
      return fresh();
    }
  }

  let data = load();

  function persist() {
    try {
      root.localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      // Keep playing on the in-memory copy.
    }
  }

  G.Save = {
    get level() { return data.level; },
    get totalDeaths() { return data.totalDeaths; },
    get lang() { return data.lang; },
    get muted() { return data.muted; },
    setMuted(on) {
      data.muted = on;
      persist();
    },
    setLang(code) {
      data.lang = code;
      persist();
    },
    setLevel(i) {
      data.level = i;
      persist();
    },
    // The grudge system (week 2) reads this: where and how the player died on each level.
    recordDeath(levelId, x, y, cause) {
      data.totalDeaths++;
      const list = data.deaths[levelId] || (data.deaths[levelId] = []);
      list.push({ x: Math.round(x), y: Math.round(y), cause });
      if (list.length > MAX_DEATHS_PER_LEVEL) list.shift();
      persist();
    },
    deathsFor(levelId) { return data.deaths[levelId] || []; },
    memoryFor(levelId) { return data.memory[levelId] || { deaths: 0, active: [] }; },
    setMemory(levelId, mem) {
      data.memory[levelId] = mem;
      persist();
    },
    reset() {
      const { lang, muted } = data; // a new game keeps the player's settings
      data = fresh();
      data.lang = lang;
      data.muted = muted;
      persist();
    },
  };
})(globalThis);

        drawMover(a, x, y, s, theme);
        break;
      case 'pad':
        drawPad(a, s);
        break;
      case 'door': {
        const chomp = a.fake && s.status === 'dead' && s.killer === a.id;
        drawDoor(a, x, y, chomp, a.id === 'door' && s.locked);
        break;
      }
    }
  }

  function drawMover(a, x, y, s, theme) {
    if (a.state === 'gone') return;
    x = sn(x);
    y = sn(y);
    switch (a.look) {
      case 'crusher': {
        const wob = a.state === 'wait' ? sn(Math.sin(s.tick * 1.2) * 2.5) : 0;
        blockPiece(x + wob, y, a.w, a.h, theme, 0);
        if (a.state === 'wait' || a.state === 'move') {
          ctx.fillStyle = COL.hazard;
          ctx.fillRect(x + wob, y + a.h - 3 * P, a.w, 3 * P);
        }
        break;
      }
      case 'wall':
        ctx.fillStyle = COL.hazard;
        ctx.fillRect(x - 1000, y - C.TOP, a.w + 1000 - 24, a.h + C.TOP);
        ctx.fillStyle = '#c41e44';
        for (let j = 0; j < a.h + C.TOP; j += 6 * P) ctx.fillRect(x + a.w - 24 - 4 * P, y - C.TOP + j, 2 * P, 3 * P);
        spikeRow(x + a.w - 24, y - C.TOP, 24, a.h + C.TOP, 'right', COL.hazard);
        break;
      case 'bullet': {
        if (a.state !== 'move') return;
        // A stepped arrowhead pointing left, a body, and a faint trail.
        const midY = sn(y + a.h / 2);
        pixTri(x, midY, a.h / 2, 18, 'left', COL.hazard, '#c41e44');
        ctx.fillStyle = COL.hazard;
        ctx.fillRect(x + 18, y, a.w - 18, a.h);
        ctx.fillStyle = '#c41e44';
        ctx.fillRect(x + 18, midY, a.w - 18, a.h / 2);
        ctx.fillStyle = 'rgba(255,45,85,0.35)';
        ctx.fillRect(x + a.w + 2 * P, y + 2 * P, 12 * P, a.h - 4 * P);
        break;
      }
      case 'platform':
        ctx.fillStyle = COL.platform;
        ctx.fillRect(x, y, a.w, a.h);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(x, y, a.w, P);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x, y + a.h - 2 * P, a.w, 2 * P);
        // Rivets.
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let i = 2 * P; i < a.w - P; i += 6 * P) ctx.fillRect(x + i, y + 3 * P, P, P);
        break;
    }
  }

  function drawPad(a, s) {
    const T = C.T;
    if (a.kind === 'reverse') {
      const phase = (s.tick % 60) / 60;
      ctx.fillStyle = COL.pad;
      for (let y = 0; y < a.h; y += 20) {
        const on = ((y / 20 + Math.floor(phase * 2)) % 2) === 0;
        if (on) ctx.fillRect(a.x + T / 2 - P, y, 2 * P, 5 * P);
      }
      chevrons(a.x + T / 2, sn(a.y + a.h - 70));
      return;
    }
    ctx.fillStyle = COL.pad;
    const floor = a.side === 'floor';
    const barY = floor ? a.y + T - 3 * P : a.y;
    ctx.fillRect(a.x + P, barY, T - 2 * P, 3 * P);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(a.x + P, floor ? barY : barY + 2 * P, T - 2 * P, P);
    // An arrow shows which way it throws you.
    const bob = sn(Math.sin(s.tick * 0.06) * 3);
    const mid = a.x + T / 2;
    if (floor) pixTri(mid, a.y + P + bob, 4 * P, 8 * P, 'up', COL.pad);
    else pixTri(mid, a.y + T - P + bob, 4 * P, 8 * P, 'down', COL.pad);
  }

  function chevrons(cx, cy) {
    pixTri(cx - 7 * P, cy, 4 * P, 5 * P, 'left', COL.pad);
    pixTri(cx + 7 * P, cy, 4 * P, 5 * P, 'right', COL.pad);
  }

  function drawDeathMarks(marks) {
    // Every past life stays behind as a small burnt slice.
    ctx.globalAlpha = 0.85;
    for (const m of marks) {
      const x = Math.max(9, Math.min(C.W - 9, m.x));
      const y = Math.max(9, Math.min(C.ROWS * C.T - 9, m.y));
      ctx.save();
      ctx.translate(sn(x), sn(y + 9));
      drawToast(18, 18, COL.burntCrust, COL.burnt, { x: true });
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // The toast as a 12x12 pixel sprite: c crust, b bread, h highlight. Faces are added on top.
  const TOAST = [
    '..cccccccc..',
    '.chhbbbbbbc.',
    'chbbbbbbbbbc',
    'chbbbbbbbbbc',
    'cbbbbbbbbbbc',
    '.cbbbbbbbbc.',
    '.cbbbbbbbbc.',
    '.cbbbbbbbbc.',
    '.cbbbbbbbbc.',
    '.cbbbbbbbbc.',
    '.cbbbbbbbbc.',
    '.cccccccccc.',
  ];
  const SPRITE = 12;
  let sprite = null;

  // Paints the sprite for one frame. face: { look: -1..1, eyeH, eyeW, mouth: 'line'|'o', x: burnt eyes }.
  function toastSprite(crust, bread, face) {
    if (!sprite) {
      sprite = root.document.createElement('canvas');
      sprite.width = sprite.height = SPRITE;
    }
    const s = sprite.getContext('2d');
    s.clearRect(0, 0, SPRITE, SPRITE);
    const light = bread === COL.bread ? '#ffeec4' : '#948399';
    for (let r = 0; r < SPRITE; r++) {
      for (let c = 0; c < SPRITE; c++) {
        const k = TOAST[r][c];
        if (k === '.') continue;
        s.fillStyle = k === 'c' ? crust : k === 'h' ? light : bread;
        s.fillRect(c, r, 1, 1);
      }
    }
    if (!face) return sprite;
    if (face.x) {
      // Burnt: an X for each eye.
      s.fillStyle = COL.player;
      for (const ex of [2, 7]) {
        s.fillRect(ex, 2, 1, 1); s.fillRect(ex + 2, 2, 1, 1);
        s.fillRect(ex + 1, 3, 1, 1);
        s.fillRect(ex, 4, 1, 1); s.fillRect(ex + 2, 4, 1, 1);
      }
      return sprite;
    }
    const lx = face.look || 0;
    const eh = face.eyeH || 2, ew = face.eyeW || 1;
    s.fillStyle = COL.playerEye;
    s.fillRect(3 + lx, 5 - eh, ew, eh);
    s.fillRect(8 + lx - (ew - 1), 5 - eh, ew, eh);
    if (face.mouth === 'o') s.fillRect(5 + lx, 7, 2, 2);
    else if (face.mouth !== 'none') s.fillRect(5 + lx, 8, 2, 1);
    return sprite;
  }

  // Draws a slice standing on (0, 0), w by h world units (28 is the player's size).
  function drawToast(w, h, crust, bread, face) {
    const spr = toastSprite(crust, bread, face === undefined ? { mouth: 'none', eyeH: 0 } : face);
    const k = (SPRITE * P) / C.PW;
    const dw = Math.max(1, Math.round((w * k) / P)) * P;
    const dh = Math.max(1, Math.round((h * k) / P)) * P;
    const smooth = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(spr, -Math.round(dw / P / 2) * P, -dh, dw, dh);
    ctx.imageSmoothingEnabled = smooth;
  }

  function drawPlayer(p, alpha, fx, tick) {
    const x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha);
    const w = C.PW * fx.sqX, h = C.PH * fx.sqY;
    const flip = p.g < 0;
    ctx.save();
    ctx.translate(sn(x + C.PW / 2), sn(flip ? y : y + C.PH));
    if (flip) ctx.scale(1, -1);
    const pop = 1 + fx.pulse * 0.25;
    ctx.scale(pop, pop);
    // Eyes look where it is going and widen when falling; a worried o while falling.
    const falling = p.vy * p.g > 200;
    const look = Math.abs(p.vx) > 60 ? p.face : 0;
    const blink = tick % 340 < 12 && p.grounded;
    drawToast(w, h, COL.crust, COL.bread, {
      look,
      eyeH: blink ? 1 : falling ? 3 : 2,
      eyeW: falling ? 2 : 1,
      mouth: falling ? 'o' : 'line',
    });
    ctx.restore();
  }

  function drawBurnt(p, fx) {
    const w = C.PW * fx.sqX, h = C.PH * fx.sqY;
    ctx.save();
    ctx.translate(sn(p.x + C.PW / 2), sn(p.g < 0 ? p.y : p.y + C.PH));
    if (p.g < 0) ctx.scale(1, -1);
    drawToast(w, h, COL.burntCrust, COL.burnt, { x: true });
    ctx.restore();
  }

  function drawParticles(fx) {
    for (const p of fx.particles) {
      const k = p.life / p.max;
      const size = Math.max(P, sn(p.size * Math.min(1, k * 1.6)));
      ctx.fillStyle = p.color;
      ctx.fillRect(sn(p.x - size / 2), sn(p.y - size / 2), size, size);
    }
  }

  function pill(x, y, w, h) {
    box(x, y, w, h, 'rgba(14,12,23,0.82)');
  }

  function drawHud(g) {
    const s = g.sim;
    const def = G.LEVELS[s.index];
    const label = `${G.t('levelLabel', { n: s.index + 1 })} · ${G.t('lv_' + def.id)}`;
    const labelSize = fitSize(label, 15, 700, 330);
    ctx.font = `700 ${labelSize}px ${FONT}`;
    const lw = ctx.measureText(label).width + 22;
    // Anchored to the screen edges, so on wide phones it stays out of the level.
    const edge = bounds();
    pill(edge.L + 10, 8, lw, 26);
    text(label, edge.L + 21, 21.5, labelSize, '#fff');

    const d = `${G.t('deaths')} ${G.Save.totalDeaths}`;
    ctx.font = `700 15px ${FONT}`;
    const dw = ctx.measureText(d).width + 22;
    pill(edge.R - 10 - dw, 8, dw, 26);
    text(d, edge.R - 21, 21.5, 15, COL.hazard, 'right');

    if (s.player.reverse) {
      const r = G.t('reversed');
      ctx.font = `700 15px ${FONT}`;
      const rw = ctx.measureText(r).width + 22;
      const ry = topCentre(8);
      pill(C.W / 2 - rw / 2, ry, rw, 26);
      text(r, C.W / 2, ry + 13.5, 15, COL.pad, 'center');
    }
  }

  // The narrator: a typed-out line under the HUD. It never covers the middle of the play area.
  function drawLine(g) {
    if (!g.line) return;
    const shown = g.line.text.slice(0, Math.ceil(g.line.t * 45));
    let size = 20;
    ctx.font = `700 ${size}px ${FONT}`;
    const full = ctx.measureText(g.line.text).width;
    // Stays clear of the share button on the right.
    if (full > C.W - 200) size = Math.floor((size * (C.W - 200)) / full);
    ctx.font = `700 ${size}px ${FONT}`;
    const w = ctx.measureText(g.line.text).width + 28;
    const y = topCentre(42) + (g.sim && g.sim.player.reverse ? topCentre(8) - 8 : 0);
    pill(C.W / 2 - w / 2, y, w, size + 18);
    const x = C.W / 2 - (w - 28) / 2;
    text(shown, x, y + (size + 18) / 2, size, COL.player);
  }

  function drawWorld(g, alpha) {
    const s = g.sim;
    const lv = G.Sim.compile(s.index);
    const theme = themeFor(s.index);
    const fx = G.Fx;
    const shake = fx.shakeOffset();

    // The level itself, in pixels.
    beginPixels();
    ctx.save();
    ctx.translate(sn(shake.x), sn(shake.y));
    drawBackdrop(theme);
    ctx.save();
    ctx.translate(0, C.TOP);
    drawDeathMarks(g.marks);
    // Actors first so the fixed tiles hide anything that slides out from behind them.
    for (const a of s.actors) if (a.type === 'pad' || a.type === 'door') drawActor(a, s, alpha, theme);
    for (const a of s.actors) if (a.type !== 'pad' && a.type !== 'door') drawActor(a, s, alpha, theme);
    drawTiles(lv, theme, s.holes);
    drawStaticSpikes(lv);
    if (s.status === 'play') drawPlayer(s.player, alpha, fx, s.tick);
    else if (s.status === 'dead') drawBurnt(s.player, fx);
    drawParticles(fx);
    ctx.restore();
    if (deck) {
      const v = bounds();
      ctx.fillStyle = theme.under;
      ctx.fillRect(v.L - 40, C.H, v.R - v.L + 80, v.B - C.H + 40);
    }
    ctx.restore();
    endPixels();

    // Words, HUD and buttons on top, at full resolution.
    ctx.save();
    ctx.translate(shake.x, shake.y);
    ctx.save();
    ctx.translate(0, C.TOP);
    if (g.introT > 0) {
      const f = Math.min(1, g.introT / 0.4);
      ctx.globalAlpha = f * 0.16;
      const introV = bounds();
      text(String(s.index + 1).padStart(2, '0'), C.W / 2, (introV.T + introV.B) / 2 - C.TOP - 60, 160, '#fff', 'center', 800);
      ctx.globalAlpha = 1;
    }
    if (s.index === 0) {
      if (g.touch) {
        // Sits in the free space between the move and jump buttons.
        const [, right, jump] = G.Touch.controls();
        const gapL = right.x + right.w + 10, gapR = jump.x - 10;
        text(G.t('controlsTouch'), (gapL + gapR) / 2, 11.5 * C.T, 18, theme.bg, 'center', 700, gapR - gapL);
      } else {
        text(G.t('controls'), C.W / 2, 11.5 * C.T, 18, theme.bg, 'center');
      }
    } else if (s.index === 3) {
      text(G.t('jumpHint'), 3 * C.T, 11.5 * C.T, 13, theme.bg, 'center', 700, 225);
    }
    ctx.restore();

    // HUD and buttons stay at the top of whatever part of the level is showing.
    ctx.save();
    ctx.translate(0, hudY());
    drawHud(g);
    drawLine(g);
    ctx.restore();
    if (G.Share.inPlay()) {
      const sb = G.Share.button();
      pill(sb.x, sb.y, sb.w, sb.h);
      text(G.t('shareShort'), sb.x + sb.w / 2, sb.y + sb.h / 2 + 0.5, 15, COL.door, 'center', 700, sb.w - 8);
    }
    if (g.touch && !g.paused) drawTouchControls();
    ctx.restore();

    if (fx.flash > 0) {
      ctx.globalAlpha = fx.flash;
      fillAll(fx.flashColor);
      ctx.globalAlpha = 1;
    }
  }

  function drawTitle(g) {
    const theme = COL.themes[0];
    const groundY = 400;
    const t = g.clock;
    beginPixels();
    drawBackdrop(theme);
    const view = bounds();
    ctx.fillStyle = theme.block;
    ctx.fillRect(view.L, groundY, view.R - view.L, view.B - groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(view.L, groundY, view.R - view.L, P);
    ctx.fillStyle = theme.under;
    for (let c = Math.floor(view.L / C.T); c < view.R / C.T; c++) {
      for (let k = 0; k < 3; k++) ctx.fillRect(c * C.T + P + speck(c, 10, k) * P, groundY + 3 * P + (speck(10, c, k + 7) % 12) * P, P, P);
    }

    // The toast hops, and lands on the X marks of its previous lives.
    const period = 1.1;
    const phase = (t % period) / period;
    const hop = 4 * phase * (1 - phase);
    const sq = phase < 0.08 || phase > 0.94 ? 1.18 : 0.94;
    // Drawn twice as large here so the character reads on the title screen.
    ctx.save();
    ctx.translate(C.W / 2, sn(groundY - hop * 80));
    ctx.scale(2, 2);
    drawToast(28 * sq, 28 / sq, COL.crust, COL.bread, { look: 0, mouth: 'line' });
    ctx.restore();
    drawDeathMarks([{ x: C.W / 2 - 150, y: groundY - 9 }, { x: C.W / 2 + 120, y: groundY - 9 }, { x: C.W / 2 + 180, y: groundY - 9 }]);
    spikeRow(C.W / 2 + 230, groundY - 40, 80, 40, 'up', COL.hazard);
    spikeRow(C.W / 2 - 300, groundY - 40, 40, 40, 'up', COL.hazard);
    endPixels();

    text(G.t('title'), C.W / 2, 150, G.LANG === 'zh' ? 88 : 80, '#fff', 'center', 800);
    text(G.t('tagline'), C.W / 2, 220, 22, COL.hazard, 'center');

    const blink = Math.floor(t * 1.6) % 2 === 0;
    const returning = G.Save.level > 0;
    const prompt = g.touch ? G.t(returning ? 'contTouch' : 'startTouch') : G.t(returning ? 'cont' : 'start');
    text(prompt, C.W / 2, 462, 22, blink ? theme.bg : 'rgba(25,22,39,0.55)', 'center');
    if (g.touch) {
      if (returning) drawMenuButton(G.Touch.newGameButton(), G.t('newGame'));
    } else {
      text(G.t('tapStart'), C.W / 2, 494, 15, 'rgba(25,22,39,0.55)', 'center', 500);
    }
  }

  function drawShareButton() {
    const b = G.Share.button();
    box(b.x, b.y, b.w, b.h, COL.door);
    ctx.fillStyle = COL.doorDark;
    ctx.fillRect(b.x + P, b.y + b.h - P, b.w - 2 * P, P);
    const label = G.Game.touch ? G.t('share').replace(/\s*[（(]S[）)]/, '') : G.t('share');
    text(label, b.x + b.w / 2, b.y + b.h / 2 + 1, 19, '#0b3b2c', 'center', 700, b.w - 16);
  }

  function drawNotice(g) {
    if (!g.notice) return;
    ctx.font = `700 18px ${FONT}`;
    const w = ctx.measureText(g.notice.text).width + 28;
    const y = topCentre(16 - hudY()) + hudY(); // drawn in world space, not HUD space
    box(C.W / 2 - w / 2, y, w, 36, COL.door);
    text(g.notice.text, C.W / 2, y + 19, 18, '#0b3b2c', 'center');
  }

  // The image people send to friends. Drawn at 1200x630, the usual link-preview shape.
  function paintCard(target, W, H, st) {
    const saved = ctx;
    const savedLimit = canvasTextLimit;
    ctx = target;
    canvasTextLimit = W - 80;
    const theme = COL.themes[0];
    const groundY = H - 120;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = theme.block;
    ctx.fillRect(0, groundY, W, H - groundY);

    text(G.t('title'), 64, 72, 44, '#fff', 'left', 800);
    text(String(st.total), 64, 210, 150, COL.hazard, 'left', 800);
    ctx.font = `800 150px ${FONT}`;
    const numW = ctx.measureText(String(st.total)).width;
    text(G.t('cardBurnt'), 64 + numW + 22, 244, 38, '#fff', 'left', 700, W - 340 - numW);

    const progress = st.finished ? G.t('cardCleared') : G.t('cardReached', { n: st.reached });
    const worst = st.worst ? `  ·  ${G.t('cardWorst', { n: st.worst })}` : '';
    text(progress + worst, 64, 340, 30, COL.bread, 'left', 700, W - 330);

    // One burnt slice per death, up to what fits on the ground.
    const slices = Math.min(st.total, 26);
    for (let i = 0; i < slices; i++) {
      ctx.save();
      ctx.translate(70 + i * 30, groundY);
      drawToast(30, 30, COL.burntCrust, COL.burnt, { x: true });
      ctx.restore();
    }

    // The survivor, big, looking at the mess it made.
    ctx.save();
    ctx.translate(W - 170, groundY);
    ctx.scale(6, 6);
    drawToast(28, 28, COL.crust, COL.bread, { look: -1, mouth: 'line' });
    ctx.restore();

    text(G.t('cardDare'), W / 2, groundY + 62, 40, theme.bg, 'center', 800, W - 120);
    ctx = saved;
    canvasTextLimit = savedLimit;
  }

  function drawLangButton() {
    const b = G.Lang.button();
    pill(b.x, b.y, b.w, b.h);
    text(`▾ ${G.Lang.currentName()}`, b.x + b.w / 2, b.y + b.h / 2 + 1, 16, '#fff', 'center', 700, b.w - 12);
  }

  function drawMuteButton() {
    const b = G.Audio.button();
    pill(b.x, b.y, b.w, b.h);
    const cx = b.x + b.w / 2 - 3, cy = b.y + b.h / 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy - 4); ctx.lineTo(cx - 4, cy - 4); ctx.lineTo(cx + 3, cy - 10);
    ctx.lineTo(cx + 3, cy + 10); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx - 9, cy + 4);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 2;
    if (G.Audio.isMuted) {
      ctx.strokeStyle = COL.hazard;
      ctx.beginPath();
      ctx.moveTo(cx + 6, cy - 5); ctx.lineTo(cx + 15, cy + 5);
      ctx.moveTo(cx + 15, cy - 5); ctx.lineTo(cx + 6, cy + 5);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx + 5, cy, 7, -0.8, 0.8);
      ctx.stroke();
    }
  }

  function drawLangPicker() {
    fillAll('rgba(14,12,23,0.92)');
    for (const cell of G.Lang.cells()) {
      const active = cell.code === G.LANG;
      box(cell.x, cell.y, cell.w, cell.h, active ? COL.door : 'rgba(255,255,255,0.1)');
      text(cell.name, cell.x + cell.w / 2, cell.y + cell.h / 2 + 1, 21, active ? '#0b3b2c' : '#fff', 'center', 700, cell.w - 16);
    }
  }

  function drawEnd() {
    const theme = COL.themes[0];
    beginPixels();
    drawBackdrop(theme);
    endPixels();
    text(G.t('endTitle'), C.W / 2, 170, 58, '#fff', 'center', 800);
    text(G.t('endStat'), C.W / 2, 262, 22, 'rgba(255,255,255,0.7)', 'center');
    text(String(G.Save.totalDeaths), C.W / 2, 320, 72, COL.hazard, 'center', 800);
    drawShareButton();
    text(G.t(G.Game.touch ? 'endPromptTouch' : 'endPrompt'), C.W / 2, 462, 20, COL.player, 'center');
  }

  function drawMenuButton(b, label) {
    box(b.x, b.y, b.w, b.h, '#191627');
    text(label, b.x + b.w / 2, b.y + b.h / 2 + 1, 17, '#fff', 'center', 700, b.w - 16);
  }

  // Stepped arrow for the touch buttons: a faint dark rim (so it shows on the light floor) under a ghost fill.
  function arrow(cx, cy, dir, color, rim, k) {
    cx = sn(cx);
    cy = sn(cy);
    const half = sn(24 * k), len = sn(38 * k), tip = sn(22 * k);
    const at = (grow) => {
      if (dir === 'up') pixTri(cx, cy - tip - grow, half + grow, len + 2 * grow, 'up', grow ? rim : color);
      else if (dir === 'left') pixTri(cx - tip - grow, cy, half + grow, len + 2 * grow, 'left', grow ? rim : color);
      else pixTri(cx + tip + grow, cy, half + grow, len + 2 * grow, 'right', grow ? rim : color);
    };
    at(P);
    at(0);
  }

  function drawTouchControls() {
    for (const b of G.Touch.controls()) {
      const down = G.Touch.isDown(b.name);
      // Ghosted so the level stays readable: never a panel, only a faint arrow that works on
      // both the dark background and the light floor. A press only brightens the arrow.
      arrow(b.x + b.w / 2, b.y + b.h / 2, b.name === 'jump' ? 'up' : b.name,
        down ? 'rgba(255,201,51,0.6)' : 'rgba(255,255,255,0.22)', down ? 'rgba(14,12,23,0.35)' : 'rgba(14,12,23,0.2)', b.w / 108);
    }
    const p = G.Touch.pauseButton();
    pill(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(sn(p.x + p.w / 2 - 8), p.y + 9, 2 * P, 16);
    ctx.fillRect(sn(p.x + p.w / 2 + 3), p.y + 9, 2 * P, 16);
  }

  function drawRotate() {
    fillAll('#0e0c17');
    text(G.t('rotate'), C.W / 2, C.H / 2, 46, '#fff', 'center', 800, C.W - 80);
  }

  function drawPause() {
    fillAll('rgba(14,12,23,0.78)');
    text(G.t('paused'), C.W / 2, C.H / 2 - 24, 54, '#fff', 'center', 800);
    text(G.t(G.Game.touch ? 'resumeTouch' : 'resume'), C.W / 2, C.H / 2 + 34, 20, 'rgba(255,255,255,0.75)', 'center');
    drawShareButton();
    if (G.Game.touch) drawMenuButton(G.Touch.restartButton(), G.t('restart'));
  }

  function drawWipe(g) {
    if (!g.wipe) return;
    const p = g.wipe.t / g.wipe.dur;
    // Slides in from the left, fully covers at the halfway point, then leaves to the right.
    const v = bounds();
    const span = v.R - v.L;
    ctx.fillStyle = COL.player;
    ctx.fillRect(lerp(v.L - span, v.R, p), v.T, span, v.B - v.T);
  }

  G.Render = {
    init(c) {
      canvas = c;
      ctx = c.getContext('2d');
      resize();
      root.addEventListener('resize', resize);
    },
    frame(g, alpha) {
      layout();
      ctx.setTransform(scale, 0, 0, scale, offX, offY);
      if (g.scene === 'title') drawTitle(g);
      else if (g.scene === 'end') drawEnd();
      else drawWorld(g, alpha);
      if (g.paused) drawPause();
      if (G.Lang.available()) {
        drawLangButton();
        drawMuteButton();
      }
      if (g.langOpen) drawLangPicker();
      if (g.touch && root.innerHeight > root.innerWidth) drawRotate();
      drawNotice(g);
      drawWipe(g);
    },
    paintCard,
    bounds,
    hudY,
    resize,
    // CSS pixels per world unit: how large things really appear on this screen.
    cssScale: () => (scale * canvas.clientWidth) / canvas.width,
    // Window position to world units.
    toWorld(clientX, clientY) {
      const dpr = canvas.width / (canvas.clientWidth || 1);
      return { x: (clientX * dpr - offX) / scale, y: (clientY * dpr - offY) / scale };
    },
  };
})(globalThis);

// Game flow: title, levels, death and respawn, level clear, end screen, pause.
(function (root) {
  const G = root.Grudge;
  const C = G.CFG;
  const Input = G.Input;
  const Fx = G.Fx;

  const g = {
    scene: 'title',
    sim: null,
    paused: false,
    clock: 0,
    acc: 0,
    introT: 0,
    respawnT: 0,
    wipe: null,
    marks: [],
    line: null, // what the narrator is saying
    notice: null, // short confirmation message, e.g. after sharing
    langOpen: false, // language picker showing
    ad: false, // a commercial break is running: no input, no simulation, no SDK events
    ready: false, // Poki SDK finished starting
    touch: false, // show on-screen controls
    script: null, // test hook: a list of inputs replayed instead of the keyboard
  };

  function say(text) {
    g.line = { text, t: 0, life: 2.2 + text.length * 0.06 };
  }

  function currentId() {
    return G.LEVELS[g.sim.index].id;
  }

  function loadMarks() {
    g.marks = G.Save.deathsFor(currentId()).map((d) => ({ x: d.x, y: d.y }));
  }

  function startLevel(i, showIntro) {
    g.sim = G.Sim.create(i, G.Save.memoryFor(G.LEVELS[i].id));
    g.scene = 'play';
    g.respawnT = 0;
    loadMarks();
    if (showIntro) {
      g.introT = 1.3;
      const opening = G.Grudge.openingLine(G.LEVELS[i], G.Save.memoryFor(G.LEVELS[i].id));
      if (opening) say(opening);
    }
    const p = g.sim.player;
    Fx.reset();
    Fx.spawn(p.x + C.PW / 2, p.y + C.PH / 2);
  }

  function wipeTo(cb) {
    if (g.wipe) return;
    g.wipe = { t: 0, dur: 0.5, cb, done: false };
  }

  function goToLevel(i) {
    wipeTo(() => {
      if (i >= G.LEVELS.length) {
        G.Save.setLevel(0);
        g.sim = null;
        g.line = null;
        g.scene = 'end';
      } else {
        G.Save.setLevel(i);
        startLevel(i, true);
        if (!g.paused) G.Poki.start();
      }
    });
  }

  // Runs a commercial break, then continues. Input and SDK events stay off until it ends.
  // `when` is 'level' or 'resume'; each site allows breaks at different moments (see poki.js).
  function runBreak(done, when) {
    g.ad = true;
    Input.clear();
    G.Touch.release();
    G.Poki.commercialBreak(() => {
      G.Audio.setAdMuted(true);
    }, when).then(() => {
      G.Audio.setAdMuted(false);
      g.ad = false;
      done();
    });
  }

  function resume() {
    g.paused = false;
    if (g.scene === 'play') runBreak(() => G.Poki.start(), 'resume');
  }

  function tickPlay(dt) {
    const s = g.sim;
    g.introT = Math.max(0, g.introT - dt);

    if (C.DEV) {
      if (Input.wasPressed('BracketRight')) return goToLevel(s.index + 1);
      if (Input.wasPressed('BracketLeft') && s.index > 0) return goToLevel(s.index - 1);
    }

    if (Fx.hitstop > 0) {
      Fx.hitstop--;
      return;
    }

    if (s.status === 'play') {
      if (Input.wasPressed('KeyR')) {
        startLevel(s.index, false);
        return;
      }
      const input = g.script ? g.script.shift() || {} : Input.state();
      G.Sim.step(s, input);
      const theme = G.COLORS.themes[s.index % G.COLORS.themes.length];
      for (const e of s.events) {
        Fx.handle(e, theme);
        G.Audio.event(e, s.tick);
        if (e.type === 'trigger' && e.grudge) say(G.Grudge.rememberLine());
        if (e.type === 'doorLocked') say(G.Grudge.lockedLine());
      }
      if (s.status === 'dead') {
        G.Save.recordDeath(currentId(), s.player.x + C.PW / 2, s.player.y + C.PH / 2, s.cause);
        say(G.Grudge.onDeath(G.LEVELS[s.index], s));
        g.marks.push({ x: s.player.x + C.PW / 2, y: s.player.y + C.PH / 2 });
        if (g.marks.length > 30) g.marks.shift();
        g.respawnT = C.respawnDelay;
      } else if (s.status === 'won') {
        G.Poki.stop();
        const next = s.index + 1;
        if (next < G.LEVELS.length) runBreak(() => goToLevel(next), 'level');
        else goToLevel(next);
      }
    } else if (s.status === 'dead') {
      g.respawnT -= dt;
      if (g.respawnT <= 0) startLevel(s.index, false);
    }
  }

  function tick(dt) {
    if (g.ad) {
      Input.endTick();
      return;
    }
    g.clock += dt;
    // Phones play sideways: hold everything until the device is turned.
    if (g.touch && root.innerHeight > root.innerWidth) {
      g.pause();
      Input.endTick();
      return;
    }
    if (g.notice && (g.notice.t -= dt) <= 0) g.notice = null;
    if (g.line && !g.paused) {
      // Same typing speed as the renderer; a blip every few characters gives the narrator a voice.
      const before = Math.ceil(g.line.t * 45);
      g.line.t += dt;
      const shown = Math.ceil(g.line.t * 45);
      if (shown !== before && shown <= g.line.text.length && shown % 3 === 0) G.Audio.blip();
      if (g.line.t > g.line.life) g.line = null;
    }

    if (g.wipe) {
      g.wipe.t += dt;
      if (!g.wipe.done && g.wipe.t >= g.wipe.dur / 2) {
        g.wipe.done = true;
        g.wipe.cb();
      }
      if (g.wipe.t >= g.wipe.dur) g.wipe = null;
    }

    if (g.langOpen) {
      if (Input.wasPressed('Escape')) g.langOpen = false;
      Input.endTick();
      return;
    }

    if (g.paused) {
      if (Input.wasPressed('Escape', 'KeyP', 'Space', 'Pointer')) resume();
      Input.endTick();
      return;
    }

    switch (g.scene) {
      case 'title':
        if (!g.ready) break;
        if (Input.wasPressed('KeyN') && G.Save.level > 0) {
          g.newGame();
        } else if (Input.wasPressed('Space', 'Enter', 'Pointer', 'ArrowUp', 'KeyW')) {
          goToLevel(Math.min(G.Save.level, G.LEVELS.length - 1));
        }
        break;
      case 'play':
        // P as well as ESC: on CrazyGames ESC also leaves full screen.
        if (Input.wasPressed('Escape', 'KeyP')) {
          g.pause();
          break;
        }
        tickPlay(dt);
        break;
      case 'end':
        if (Input.wasPressed('Space', 'Enter', 'Pointer')) {
          G.Save.reset();
          goToLevel(0);
        }
        break;
    }
    Fx.update(dt);
    Input.endTick();
  }

  // Runs the fixed 60Hz simulation for the elapsed real time. Clamped so a stall cannot cause a jump.
  g.frame = function (realDt) {
    g.acc += Math.min(realDt, 0.1);
    while (g.acc >= C.STEP) {
      tick(C.STEP);
      g.acc -= C.STEP;
    }
    G.Render.frame(g, g.paused || !g.sim ? 1 : g.acc / C.STEP);
  };

  g.tick = tick;
  // `focusLost`: called because the player switched tab or window, not from the pause button.
  g.pause = function (focusLost) {
    if (g.scene === 'play' && !g.paused && !g.ad) {
      g.paused = true;
      G.Poki.stop(focusLost);
    }
    Input.clear();
    G.Touch.release();
  };
  g.newGame = function () {
    G.Save.reset();
    goToLevel(0);
  };
  g.restartFromPause = function () {
    startLevel(g.sim.index, false);
    resume();
  };

  G.Game = g;
})(globalThis);

// Share: a score card image plus a line of text, sent through the system share sheet.
// Falls back to the clipboard, then to saving the image, because support differs a lot between browsers.
// Everything up to navigator.share() runs synchronously so the browser still counts it as a user action.
(function (root) {
  const G = root.Grudge;
  const C = G.CFG;
  const CARD_W = 1200, CARD_H = 630;

  function stats() {
    const levels = G.LEVELS.map((def, i) => ({ i, deaths: G.Save.memoryFor(def.id).deaths }));
    const worst = levels.reduce((best, l) => (l.deaths > best.deaths ? l : best), { i: -1, deaths: 0 });
    const finished = G.Game.scene === 'end';
    const reached = finished ? G.LEVELS.length : (G.Game.sim ? G.Game.sim.index + 1 : 1);
    return { total: G.Save.totalDeaths, worst: worst.deaths > 0 ? worst.i + 1 : 0, finished, reached };
  }

  function shareText(st) {
    const g = G.t('title');
    const parts = [st.finished ? G.t('shareDone', { g, n: st.total }) : G.t('shareAt', { g, r: st.reached, n: st.total })];
    if (st.worst) parts.push(G.t('shareWorst', { w: st.worst }));
    parts.push(G.t('cardDare'));
    const line = parts.join(G.Lang.sentenceGap());
    const url = G.Poki.shareUrl || C.SHARE_URL;
    return url ? `${line} ${url}` : line;
  }

  function cardBlob(st) {
    const canvas = root.document.createElement('canvas');
    canvas.width = CARD_W;
    canvas.height = CARD_H;
    G.Render.paintCard(canvas.getContext('2d'), CARD_W, CARD_H, st);
    const bytes = root.atob(canvas.toDataURL('image/png').split(',')[1]);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return new Blob([arr], { type: 'image/png' });
  }

  function saveImage(blob) {
    const a = root.document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'burnt-again.png';
    a.click();
    root.setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function notify(key) {
    G.Game.notice = { text: G.t(key), t: 2.8 };
  }

  G.Share = {
    stats,
    shareText,
    cardBlob,
    available() {
      return G.Game.scene === 'end' || (G.Game.scene === 'play' && G.Game.paused);
    },
    inPlay() {
      return G.Game.scene === 'play' && !G.Game.paused;
    },
    // Logical-screen rectangle of the button on the current screen.
    button() {
      if (this.inPlay()) return { x: G.Render.bounds().R - 80, y: 38 + G.Render.hudY(), w: 70, h: G.Game.touch ? 34 : 26 }; // small one under the death counter
      const y = G.Game.scene === 'end' ? 372 : C.H / 2 + 76;
      return { x: C.W / 2 - 120, y, w: 240, h: 48 };
    },
    async trigger() {
      const st = stats();
      const text = shareText(st);
      const blob = cardBlob(st);
      const nav = root.navigator;
      const file = new File([blob], 'burnt-again.png', { type: 'image/png' });
      if (nav.canShare && nav.canShare({ files: [file] })) {
        try {
          await nav.share({ files: [file], text, title: G.t('title') });
          return 'shared';
        } catch (e) {
          if (e && e.name === 'AbortError') return 'cancelled'; // the player closed the share sheet
        }
      }
      try {
        await nav.clipboard.write([new root.ClipboardItem({
          'image/png': blob,
          'text/plain': new Blob([text], { type: 'text/plain' }),
        })]);
        notify('shareCopied');
        return 'copied';
      } catch (e) {
        // Clipboard images are blocked here; save the picture and try to copy the text.
      }
      saveImage(blob);
      try {
        await nav.clipboard.writeText(text);
      } catch (e) {
        // The saved image still carries the score.
      }
      notify('shareSaved');
      return 'saved';
    },
  };
})(globalThis);

// Playtest panel (T key): change the feel live, then send the numbers back as feedback. Dev builds only.
(function (root) {
  const G = root.Grudge;
  const C = G.CFG;
  const zh = G.LANG === 'zh';
  const SLIDERS = [
    ['runSpeed', zh ? '跑动速度' : 'Run speed', 200, 420, 5],
    ['groundAccel', zh ? '起步加速' : 'Ground accel', 1000, 6000, 100],
    ['groundFric', zh ? '停下刹车' : 'Ground stop', 1000, 8000, 100],
    ['airAccel', zh ? '空中控制' : 'Air control', 600, 4000, 100],
    ['jumpVel', zh ? '跳跃力度' : 'Jump power', 600, 950, 5],
    ['gravity', zh ? '重力' : 'Gravity', 1400, 3400, 50],
    ['fallMult', zh ? '下落加重' : 'Fall weight', 1, 2, 0.05],
    ['jumpCut', zh ? '松键收跳' : 'Jump cut', 0.2, 1, 0.05],
    ['coyote', zh ? '离台宽容(秒)' : 'Coyote (s)', 0, 0.2, 0.01],
    ['buffer', zh ? '提前按跳(秒)' : 'Jump buffer (s)', 0, 0.25, 0.01],
    ['respawnDelay', zh ? '复活等待(秒)' : 'Respawn (s)', 0.1, 1, 0.02],
  ];

  G.Tuning = {
    attach() {
      if (!C.DEV) return;
      const panel = root.document.getElementById('tune');
      const defaults = {};
      const rows = [];
      panel.innerHTML = `<b>${zh ? '手感调节（T 关闭）' : 'Feel tuning (T to close)'}</b><div>${zh ? '[ 和 ] 键切换关卡' : '[ and ] change level'}</div>`;
      for (const [key, label, min, max, step] of SLIDERS) {
        defaults[key] = C[key];
        const row = root.document.createElement('div');
        row.innerHTML = `<label><span>${label}</span><span class="v"></span></label><input type="range" min="${min}" max="${max}" step="${step}">`;
        const input = row.querySelector('input');
        const value = row.querySelector('.v');
        const sync = () => {
          input.value = C[key];
          value.textContent = C[key];
        };
        input.addEventListener('input', () => {
          C[key] = Number(input.value);
          value.textContent = C[key];
        });
        sync();
        rows.push(sync);
        panel.appendChild(row);
      }
      const reset = root.document.createElement('button');
      reset.textContent = zh ? '恢复默认' : 'Reset';
      reset.addEventListener('click', () => {
        Object.assign(C, defaults);
        rows.forEach((sync) => sync());
      });
      panel.appendChild(reset);

      root.addEventListener('keydown', (e) => {
        if (e.code === 'KeyT' && !e.repeat) {
          panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
          root.document.activeElement && root.document.activeElement.blur();
        }
      });
    },
  };
})(globalThis);

// Entry point.
(function (root) {
  const G = root.Grudge;
  const canvas = root.document.getElementById('game');

  G.Lang.init();
  const toWorld = (e) => G.Render.toWorld(e.clientX, e.clientY);
  G.Render.init(canvas);
  const inRect = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
  // Language button and picker. Runs first so a click here does not also start or resume the game.
  canvas.addEventListener('pointerdown', (e) => {
    const { x, y } = toWorld(e);
    const g = G.Game;
    G.Audio.unlock();
    if (g.ad) return;
    if (!g.langOpen && G.Lang.available() && inRect(x, y, G.Audio.button())) {
      G.Audio.toggleMute();
      e.stopImmediatePropagation();
      e.preventDefault();
    } else if (g.langOpen) {
      const cell = G.Lang.cells().find((c) => inRect(x, y, c));
      if (cell) G.Lang.set(cell.code);
      g.langOpen = false;
      G.Audio.play('ui');
      e.stopImmediatePropagation();
      e.preventDefault();
    } else if (G.Lang.available() && inRect(x, y, G.Lang.button())) {
      g.langOpen = true;
      G.Audio.play('ui');
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  });
  // Registered before the input layer so a click on the share button does not also resume or restart.
  canvas.addEventListener('pointerdown', (e) => {
    if (G.Game.ad || (!G.Share.available() && !G.Share.inPlay())) return;
    const { x, y } = toWorld(e);
    const b = G.Share.button();
    if (inRect(x, y, b)) {
      e.stopImmediatePropagation();
      e.preventDefault();
      // Stop the action first, so nothing kills the player behind the share sheet.
      if (G.Share.inPlay()) G.Game.pause();
      G.Share.trigger();
    }
  });
  root.addEventListener('keydown', (e) => {
    G.Audio.unlock();
    if (e.code === 'KeyS' && !e.repeat && G.Share.available()) G.Share.trigger();
    if (e.code === 'KeyL' && !e.repeat && G.Lang.available()) G.Lang.next();
    if (e.code === 'KeyM' && !e.repeat && !G.Game.ad) G.Audio.toggleMute();
  });
  // iOS Safari counts the end of a tap, not its start, as permission to play sound.
  for (const type of ['pointerup', 'touchend']) root.addEventListener(type, () => G.Audio.unlock(), { passive: true });
  G.Touch.attach(canvas);
  G.Input.attach(canvas);
  G.Tuning.attach();
  canvas.focus();

  // Stop when the player leaves, so nobody dies while the tab is in the background.
  root.addEventListener('blur', () => {
    G.Audio.setFocused(false);
    G.Game.pause(true);
  });
  root.addEventListener('focus', () => {
    G.Audio.setFocused(true);
    G.Audio.resume();
  });
  root.document.addEventListener('visibilitychange', () => {
    G.Audio.setFocused(!root.document.hidden);
    if (root.document.hidden) G.Game.pause(true);
  });

  // Never hold the game back for long if the SDK is slow or blocked.
  Promise.race([G.Poki.init(), new Promise((r) => root.setTimeout(r, 2500))]).then(() => {
    G.Game.ready = true;
  });

  let last = root.performance.now();
  function loop(now) {
    const dt = (now - last) / 1000;
    last = now;
    G.Game.frame(dt);
    root.requestAnimationFrame(loop);
  }
  root.requestAnimationFrame(loop);
})(globalThis);

</script>
